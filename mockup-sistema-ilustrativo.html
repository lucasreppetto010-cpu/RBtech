<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup ilustrativo · Sistema de Gestão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;1,800&family=JetBrains+Mono:wght@400&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
/* Tela ilustrativa de sistema de gestão (RB Tech). Copie o bloco .mock-card + este CSS para reutilizar. */
:root{
  --bg:#02050B; --surface:#0A1324; --line:#152340; --ink:#EAF2FF; --muted:#8C9DC2;
  --blue:#1764FF; --cyan:#2FC8FF;
  --grad:linear-gradient(120deg, #2FC8FF 0%, #1764FF 55%, #0B3FD9 100%);
  --display:"Exo 2", "Arial Black", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk", system-ui, sans-serif;padding:24px}
.mock-card{width:min(640px, 100%);border-radius:24px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.mock-shot{position:relative;padding:1.6rem 1.6rem 0;background:radial-gradient(90% 100% at 50% 0%, color-mix(in srgb, var(--blue) 35%, transparent), transparent 70%)}
.badge{position:absolute;top:2.2rem;right:2.2rem;font-family:var(--mono);font-size:.66rem;padding:.25rem .55rem;border-radius:999px;background:color-mix(in srgb, var(--bg) 75%, transparent);border:1px solid var(--line);color:var(--muted);z-index:2}
.win{border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:var(--bg);overflow:hidden;box-shadow:0 -10px 40px -10px color-mix(in srgb, var(--blue) 50%, transparent)}
.win-bar{display:flex;align-items:center;gap:6px;padding:.55rem .75rem;border-bottom:1px solid var(--line)}
.win-bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.win-bar span{margin-left:.6rem;font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash{display:grid;grid-template-columns:52px 1fr;min-height:240px}
.dash-side{border-right:1px solid var(--line);padding:.8rem .6rem;display:grid;gap:.6rem;align-content:start}
.dash-side b{width:30px;height:30px;border-radius:8px;background:var(--grad);display:block}
.dash-side i{display:block;height:8px;border-radius:4px;background:var(--line)}
.dash-side i.on{background:var(--cyan)}
.dash-main{padding:.9rem;display:grid;gap:.7rem;align-content:start;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:.5rem}
.kpi{border:1px solid var(--line);border-radius:10px;padding:.55rem .6rem;display:grid;gap:.3rem;font-size:.66rem;color:var(--muted);min-width:0}
.kpi b{font-family:var(--display);font-size:1rem;color:var(--ink);white-space:nowrap}
.chart{border:1px solid var(--line);border-radius:10px;padding:.7rem;display:flex;align-items:end;gap:5px;height:96px}
.chart span{flex:1;border-radius:4px 4px 0 0;background:var(--grad);opacity:.85}
.rows{display:grid;gap:.35rem}
.rows i{display:block;height:8px;border-radius:4px;background:var(--line)}
@media (max-width:480px){.dash{grid-template-columns:40px 1fr}.kpi b{font-size:.85rem}}
</style>
</head>
<body>
<div class="mock-card">
  <div class="mock-shot">
    <span class="badge">prévia ilustrativa</span>
    <div class="win" aria-hidden="true">
      <div class="win-bar"><i></i><i></i><i></i><span>Sistema de Gestão · RB Tech</span></div>
      <div class="dash">
        <div class="dash-side"><b></b><i class="on"></i><i></i><i></i><i></i><i></i></div>
        <div class="dash-main">
          <div class="kpis">
            <div class="kpi">Vendas do dia<b>R$ 4.280</b></div>
            <div class="kpi">Pedidos<b>37</b></div>
            <div class="kpi">Estoque baixo<b>5 itens</b></div>
          </div>
          <div class="chart"><span style="height:40%"></span><span style="height:62%"></span><span style="height:48%"></span><span style="height:75%"></span><span style="height:58%"></span><span style="height:88%"></span><span style="height:70%"></span><span style="height:95%"></span></div>
          <div class="rows"><i style="width:92%"></i><i style="width:78%"></i><i style="width:85%"></i></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
