<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <title>Sistema de gestão · Demonstração RB Tech</title>
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="D&amp;C" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>
  <!-- Login -->
  <section id="login" class="login" hidden>
    <div class="login__wrap">
    <img src="logo.png" alt="D&amp;C Oficina Mecânica" class="login__marca" />
    <div class="login__box">
      <h1>Controle da oficina</h1>
      <p class="muted">Acesso restrito aos donos</p>
      <form id="loginForm" autocomplete="on">
        <label>E-mail<input type="email" name="email" required autocomplete="username" /></label>
        <label>Senha<input type="password" name="senha" required autocomplete="current-password" /></label>
        <p class="erro" id="loginErro" hidden></p>
        <button class="btn btn--primary btn--full" type="submit">Entrar</button>
      </form>
      <p class="demo-aviso" id="demoLogin" hidden>Modo demonstração: qualquer e-mail e senha entram. Os dados ficam só neste aparelho.</p>
    </div>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topo">
      <div class="topo__esq">
        <img src="icon-192.png" alt="" class="topo__logo" />
        <div>
          <p class="topo__sub" id="topoSub"></p>
          <h1 class="topo__titulo" id="topoTitulo">Início</h1>
        </div>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>
    <div class="faixa-demo" id="faixaDemo" hidden>Demonstração com dados de exemplo, pode mexer à vontade · <a href="/" style="color:inherit">feito pela RB Tech</a></div>

    <main id="main"></main>

    <button class="fab" id="fab" aria-label="Novo serviço">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>

    <nav class="nav">
      <a href="#inicio" data-tab="inicio">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Resumo
      </a>
      <a href="#servicos" data-tab="servicos">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.4-.4-2.4z"/></svg>Serviços
      </a>
      <a href="#clientes" data-tab="clientes">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-1.5-5-4-5.6"/></svg>Clientes
      </a>
      <a href="#despesas" data-tab="despesas">
        <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Despesas
      </a>
    </nav>
  </div>

  <div class="carregando" id="carregando"><span></span></div>
  <div class="toast" id="toast" hidden></div>
  <div class="sheet-fundo" id="sheetFundo" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

  <script src="app.js"></script>
</body>
</html>
